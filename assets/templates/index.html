{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portfolio & Risk Calculator</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body>
    <div class="container">
        <h1>Investment Portfolio & Risk Calculator</h1>
        
        <!-- Navigation Menu -->
        <div class="tabs">
            <button class="tab-button" onclick="showTab('investmentCalculator')">📊 Investment Calculator</button>
            <button class="tab-button" onclick="showTab('monteCarloSimulation')">📈 Monte Carlo Simulation</button>
            <button class="tab-button" onclick="showTab('valueAtRisk')">📉 Value at Risk (VaR)</button>
            <button class="tab-button" onclick="showTab('targetProbability')">🎯 Probability of Hitting Target</button>
            <button class="tab-button" onclick="showTab('portfolioRisk')">📊 Portfolio Risk Analysis</button>
            <button class="tab-button" onclick="showTab('drawdownProbability')">🔻 Probability of Drawdown</button>
            <button class="tab-button" onclick="showTab('bayesianPrediction')">🧠 Bayesian Prediction Tool</button>
        </div>

        <!-- Tab Content -->
        <div id="investmentCalculator" class="tab-content">
            <h2>Investment Growth Calculator</h2>
            <div class="input-group">
                <label for="currency">Choose Currency:</label>
                <select id="currency">
                    <option value="USD">USD</option>
                    <option value="INR">INR</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
            <div class="input-group">
                <label for="assetPrice">Current Asset Price:</label>
                <input type="number" id="assetPrice" placeholder="Enter current asset price">
            </div>
            <div class="input-group">
                <label for="growthRate">Estimated Annual Growth (%):</label>
                <input type="number" id="growthRate" placeholder="Enter growth rate in %">
            </div>
            <div class="input-group">
                <label for="years">Number of Years:</label>
                <input type="number" id="years" placeholder="Enter number of years">
            </div>
            <div class="input-group">
                <button onclick="calculateInvestment()">Calculate Investment</button>
            </div>
            <div id="results"></div>
        </div>

        <div id="monteCarloSimulation" class="tab-content">
            <h2>Monte Carlo Simulation</h2>
            <div class="input-group">
                <label for="simulations">Number of Simulations:</label>
                <input type="number" id="simulations" placeholder="Enter number of simulations">
            </div>
            <div class="input-group">
                <label for="assetPriceMC">Initial Asset Price:</label>
                <input type="number" id="assetPriceMC" placeholder="Enter initial asset price">
            </div>
            <div class="input-group">
                <label for="growthRateMC">Annual Growth Rate (%):</label>
                <input type="number" id="growthRateMC" placeholder="Enter growth rate in %">
            </div>
            <button onclick="runMonteCarlo()">Run Simulation</button>
            <div id="mcResults"></div>
        </div>

        <!-- Value at Risk (VaR) -->
        <div id="valueAtRisk" class="tab-content">
            <h2>Value at Risk (VaR)</h2>
            <div class="input-group">
                <label for="portfolioValue">Portfolio Value:</label>
                <input type="number" id="portfolioValue" placeholder="Enter portfolio value">
            </div>
            <div class="input-group">
                <label for="confidenceLevel">Confidence Level (%):</label>
                <input type="number" id="confidenceLevel" placeholder="Enter confidence level (e.g., 95)">
            </div>
            <div class="input-group">
                <label for="volatility">Volatility (%):</label>
                <input type="number" id="volatility" placeholder="Enter volatility">
            </div>
            <button onclick="calculateVaR()">Calculate VaR</button>
            <div id="VaRResults"></div>
        </div>

        <!-- Probability of Hitting Target -->
        <div id="targetProbability" class="tab-content">
            <h2>Probability of Hitting Target</h2>
            <div class="input-group">
                <label for="targetPrice">Target Price:</label>
                <input type="number" id="targetPrice" placeholder="Enter target price">
            </div>
            <div class="input-group">
                <label for="currentPrice">Current Price:</label>
                <input type="number" id="currentPrice" placeholder="Enter current price">
            </div>
            <div class="input-group">
                <label for="daysToTarget">Days to Target:</label>
                <input type="number" id="daysToTarget" placeholder="Enter days to target">
            </div>
            <button onclick="calculateHitProbability()">Calculate Probability</button>
            <div id="hitProbabilityResults"></div>
        </div>

        <!-- Portfolio Risk Analysis -->
        <div id="portfolioRisk" class="tab-content">
            <h2>Portfolio Risk Analysis</h2>
            <div class="input-group">
                <label for="asset1Return">Return of Asset 1 (%):</label>
                <input type="number" id="asset1Return" placeholder="Enter asset 1 return">
            </div>
            <div class="input-group">
                <label for="asset2Return">Return of Asset 2 (%):</label>
                <input type="number" id="asset2Return" placeholder="Enter asset 2 return">
            </div>
            <div class="input-group">
                <label for="correlation">Correlation Between Assets:</label>
                <input type="number" id="correlation" placeholder="Enter correlation">
            </div>
            <button onclick="calculatePortfolioRisk()">Calculate Portfolio Risk</button>
            <div id="portfolioRiskResults"></div>
        </div>

        <!-- Probability of Drawdown -->
        <div id="drawdownProbability" class="tab-content">
            <h2>Probability of Drawdown</h2>
            <div class="input-group">
                <label for="maxDrawdown">Maximum Drawdown (%):</label>
                <input type="number" id="maxDrawdown" placeholder="Enter max drawdown">
            </div>
            <div class="input-group">
                <label for="historicalReturns">Historical Returns (%):</label>
                <input type="number" id="historicalReturns" placeholder="Enter historical returns">
            </div>
            <button onclick="calculateDrawdownProbability()">Calculate Probability</button>
            <div id="drawdownProbabilityResults"></div>
        </div>

        <!-- Bayesian Prediction Tool -->
        <div id="bayesianPrediction" class="tab-content">
            <h2>Bayesian Prediction Tool</h2>
            <div class="input-group">
                <label for="prior">Prior Probability (%):</label>
                <input type="number" id="prior" placeholder="Enter prior probability">
            </div>
            <div class="input-group">
                <label for="likelihood">Likelihood (%):</label>
                <input type="number" id="likelihood" placeholder="Enter likelihood">
            </div>
            <button onclick="calculateBayesianPrediction()">Calculate Prediction</button>
            <div id="bayesianPredictionResults"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
